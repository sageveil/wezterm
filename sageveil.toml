[metadata]
name = "sageveil"
author = "sageveil"
origin_url = "https://github.com/sageveil/sageveil"

[colors]
foreground = "#A8AFA6"
background = "#101411"

cursor_bg = "#A8AFA6"
cursor_fg = "#101411"
cursor_border = "#A8AFA6"

selection_fg = "#A8AFA6"
selection_bg = "#241d21"

scrollbar_thumb = "#4E504C"
split = "#4E504C"

ansi = [
  "#101411",
  "#9A6B6B",
  "#859270",
  "#A69966",
  "#8A8493",
  "#876f7f",
  "#7F9476",
  "#A8AFA6",
]

brights = [
  "#26322A",
  "#B08585",
  "#99A888",
  "#C6B67E",
  "#A39DAC",
  "#947e8d",
  "#9AAB90",
  "#c3cdc0",
]

[colors.tab_bar]
background = "#1D2320"

[colors.tab_bar.active_tab]
bg_color = "#101411"
fg_color = "#859270"
intensity = "Normal"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#1D2320"
fg_color = "#8A928B"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#1F2624"
fg_color = "#A8AFA6"
italic = false

[colors.tab_bar.new_tab]
bg_color = "#1D2320"
fg_color = "#8A928B"

[colors.tab_bar.new_tab_hover]
bg_color = "#1F2624"
fg_color = "#A8AFA6"
italic = false
